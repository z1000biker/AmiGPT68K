name: AmiGPT 68K v0.8 Cross Build

on:
  push:
    branches: [build-v0.8-binaries]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Run portable core tests
        run: make clean test

      - name: Build AmigaOS 68K CLI and GUI executables
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm --user "$(id -u):$(id -g)" -v "$PWD:/src" -w /src \
            docker.io/amigadev/crosstools:m68k-amigaos \
            sh -lc 'set -e; export PATH=/opt/m68k-amigaos/bin:$PATH; make clean; make amiga-all gui-all; command -v m68k-amigaos-nm; m68k-amigaos-nm build/amiga/AmiGPTGUI040 | grep -E "(__stack|__stkinit)"'

      - name: Generate Workbench icons
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/make_classic_info.py

      - name: Verify HUNK binaries, endpoints and icons
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import struct, subprocess
          names=['AmiGPT020','AmiGPT030FPU','AmiGPT040','AmiGPTGUI020','AmiGPTGUI030FPU','AmiGPTGUI040']
          for n in names:
              p=Path('build/amiga')/n
              d=p.read_bytes()
              assert len(d) > 10000, (n, len(d))
              assert struct.unpack('>I', d[:4])[0] == 0x3f3, (n, d[:4].hex())
              st=subprocess.check_output(['strings', str(p)], text=True, errors='ignore')
              for x in ['api.openai.com','/v1/models','/v1/responses']:
                  assert x in st, (n, 'missing', x)
              for x in ['/backend-api/codex/models','/backend-api/codex/responses','originator: codex_cli_rs','ChatGPT-Account-ID']:
                  assert x not in st, (n, 'legacy string present', x)
              if n.startswith('AmiGPTGUI'):
                  for x in ['AmiGPT68K v0.8','Model','Prompt','Send','Models','Refresh','Clear','Network init failed:']:
                      assert x in st, (n, 'missing GUI string', x)
              icon=Path('icons')/(n+'.info')
              raw=icon.read_bytes()
              assert raw[:4] == bytes.fromhex('e3100001'), (n, 'bad icon header', raw[:4].hex())
              assert len(raw) > 700, (n, 'icon too small', len(raw))
              print(n, len(d), 'HUNK verified;', icon.name, len(raw), 'bytes')
          PY

      - name: Package binaries
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          for n in AmiGPT020 AmiGPT030FPU AmiGPT040 AmiGPTGUI020 AmiGPTGUI030FPU AmiGPTGUI040; do
            cp "build/amiga/$n" dist/
            cp "icons/$n.info" dist/
          done
          printf '%s\n' \
            'AmiGPT68K v0.8 development cross-build' \
            'Includes CLI and native Intuition/GadTools GUI executables' \
            'Includes classic Workbench .info icons with 128 KiB stack setting' \
            'GUI now displays the exact bsdsocket/AmiSSL initialization error instead of a generic RETURN 20' \
            'Public SIWC data path: api.openai.com/v1/models + /v1/responses' \
            'Not runtime-validated yet; test in WinUAE before release' > dist/BUILD-VERIFIED.txt
          (cd dist && sha256sum AmiGPT020 AmiGPT030FPU AmiGPT040 AmiGPTGUI020 AmiGPTGUI030FPU AmiGPTGUI040 > SHA256SUMS.txt)
          (cd dist && zip -9 ../AmiGPT68K-v0.8-dev-BINARIES.zip \
            AmiGPT020 AmiGPT020.info AmiGPT030FPU AmiGPT030FPU.info AmiGPT040 AmiGPT040.info \
            AmiGPTGUI020 AmiGPTGUI020.info AmiGPTGUI030FPU AmiGPTGUI030FPU.info AmiGPTGUI040 AmiGPTGUI040.info \
            BUILD-VERIFIED.txt SHA256SUMS.txt)

      - uses: actions/upload-artifact@v4
        with:
          name: AmiGPT68K-v0.8-dev-binaries
          path: |
            AmiGPT68K-v0.8-dev-BINARIES.zip
            dist/AmiGPT020
            dist/AmiGPT020.info
            dist/AmiGPT030FPU
            dist/AmiGPT030FPU.info
            dist/AmiGPT040
            dist/AmiGPT040.info
            dist/AmiGPTGUI020
            dist/AmiGPTGUI020.info
            dist/AmiGPTGUI030FPU
            dist/AmiGPTGUI030FPU.info
            dist/AmiGPTGUI040
            dist/AmiGPTGUI040.info
            dist/SHA256SUMS.txt
          if-no-files-found: error
